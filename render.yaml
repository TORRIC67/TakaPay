# DATABASE: Render's free Postgres is DELETED 30 days after you create it, so it is not used here.
# Create a free database on Neon (neon.com) instead and paste its connection string as DATABASE_URL below.
# Step-by-step guide: DEPLOY-FREE.md
services:
  # ---- Backend (FastAPI) ----
  - type: web
    name: smarttaka-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # paste the Neon connection string in the Render dashboard (never commit it)
      - key: SECRET_KEY
        generateValue: true
      # The next two must be the REAL address of your frontend (Render may add letters if the name is taken):
      - key: CORS_ORIGINS
        value: '["https://smarttaka.onrender.com"]'
      - key: APP_URL
        value: https://smarttaka.onrender.com
      - key: PAYMENT_PROVIDER
        value: harakapay
      - key: HARAKAPAY_API_KEY
        sync: false
      - key: HARAKAPAY_WEBHOOK_TOKEN
        sync: false
      - key: HARAKAPAY_WEBHOOK_URL
        sync: false
      - key: MONTHLY_FEE_TZS
        value: "200"
      - key: APP_NAME
        value: Smart Taka
      - key: BANK_ACCOUNT_NUMBER
        value: "31410034454"
      - key: BANK_NAME
        value: NMB
      - key: BANK_ACCOUNT_NAME
        value: ADMIN SALU
      - key: SMS_PROVIDER
        value: meseji
      - key: MESEJI_API_KEY
        sync: false
      - key: MESEJI_SENDER_ID
        value: MESEJI
      - key: SENSOR_API_KEY
        sync: false
      - key: DEPOT_LATITUDE
        value: "-6.838848"
      - key: DEPOT_LONGITUDE
        value: "39.271071"
      - key: FUEL_PRICE_TZS_PER_LITER
        value: "3000"

  # ---- Frontend (React + Vite, static) ----
  - type: web
    name: smarttaka
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://smarttaka-api.onrender.com
